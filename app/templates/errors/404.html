{% extends "base.html" %}

{% block title %}Page Not Found (404) | Digirary{% endblock %}

{% block content %}
<section class="error-page-section">
    <div class="container text-center">
        <div class="error-code-badge">404</div>
        <h1 class="error-title">Volume Not Found</h1>
        <p class="error-desc">The digital resource or page you requested could not be located in our library index.</p>
        <div class="error-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return Home</a>
            <a href="{{ url_for('books.list_books') }}" class="btn btn-secondary">Browse Books</a>
        </div>
    </div>
</section>
{% endblock %}
