{% extends "base.html" %}

{% block title %}Log In | Digirary{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-badge">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to manage your borrowed books and explore the catalogue.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="auth-form">
                <div class="form-group">
                    <label for="identifier" class="form-label">Username or Email</label>
                    <input 
                        type="text" 
                        id="identifier" 
                        name="identifier" 
                        class="form-control" 
                        placeholder="e.g. reader or reader@example.com"
                        required 
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div class="form-check-group">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember" value="1">
                        <span class="checkbox-checkmark"></span>
                        <span class="checkbox-label">Keep me logged in on this device</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('auth.register') }}" class="link-accent">Register here</a></p>
                <div class="demo-credentials-box">
                    <span class="demo-tag">Admin Account for Testing</span>
                    <code>admin</code> / <code>admin123</code>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
